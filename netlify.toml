# Netlify config for the Branding admin feature.
#
# This intentionally does NOT declare [build] command/publish — those stay
# whatever is already configured in the Netlify site dashboard. The only
# build-related setting here is `functions`, which just tells Netlify where
# to find the serverless functions added for branding storage.
[build]
  functions = "netlify/functions"

# Lets `netlify dev` proxy the existing Vite dev server (port 8080) while
# also spinning up Functions + a sandboxed local Blobs store. Run
# `pnpm run dev:netlify` (not `pnpm run dev`) when working on anything under
# /admin — that's the only local command that has working /api/* routes,
# because Functions only exist inside Netlify's dev proxy, not in bare Vite.
[dev]
  command = "vite --port 8080"
  targetPort = 8080

# Route the branding admin API + public brand endpoint to functions.
[[redirects]]
  from = "/api/brand/active"
  to = "/.netlify/functions/brand-active"
  status = 200

[[redirects]]
  from = "/api/admin/branding"
  to = "/.netlify/functions/admin-branding"
  status = 200

[[redirects]]
  from = "/api/admin/brands"
  to = "/.netlify/functions/admin-brands"
  status = 200

# /api/admin/brands/:slug is NOT redirected here — admin-brand-detail.ts
# declares that path itself via its own `config.path` export instead of a
# query-string rewrite. See that file's header comment for why.

# /api/admin/assets/:filename is likewise handled by admin-assets.ts's own
# `config.path` — no redirect needed for either that or the plain
# /api/admin/assets list route, since the same function's config covers
# both.

[[redirects]]
  from = "/api/admin/upload"
  to = "/.netlify/functions/admin-upload"
  status = 200

[[redirects]]
  from = "/api/admin/promote"
  to = "/.netlify/functions/admin-promote"
  status = 200

[[redirects]]
  from = "/api/admin/promote-targets"
  to = "/.netlify/functions/admin-promote-targets"
  status = 200

# Uploaded logos/favicons/etc. now live in Netlify Blobs, not on disk.
# serve-upload.ts declares /uploads/:file itself via its own `config.path`
# (see that file's header comment) rather than a redirect here — no entry
# needed in this list.

# Receives promoted brand data from another environment (e.g. your local
# dev, promoting to prod). Guarded by the PROMOTE_SECRET env var inside the
# function itself, not by anything here.
[[redirects]]
  from = "/api/admin/promote-receive"
  to = "/.netlify/functions/admin-promote-receive"
  status = 200
